<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 268px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #fff;
      }
      h1 { margin: 0 0 2px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: #475569; }
      .state { display: flex; align-items: center; gap: 7px; margin: 8px 0 10px; font-weight: 600; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; }
      .ok .dot { background: #059669; }
      .off .dot { background: #d97706; }
      p { margin: 0 0 10px; color: #475569; font-size: 12px; }
      button {
        width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 7px;
        background: #f8fafc; font: inherit; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #f1f5f9; }
      a { color: #4f46e5; font-size: 12px; }
      .api { margin-top: 10px; font-size: 11px; color: #94a3b8; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>JobPilot Auto-apply</h1>
    <div class="state" id="state"><span class="dot"></span><span id="stateText">Checking…</span></div>
    <p id="hint"></p>
    <button id="fill">Fill this page</button>
    <p class="api" id="api"></p>
    <a href="#" id="options">Settings</a>
    <script src="popup.js"></script>
  </body>
</html>
