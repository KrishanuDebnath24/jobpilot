# JobPilot — Phase 1 stack.
# Infra (Postgres+pgvector, Redis, MinIO) -> migrate (schema + seed) -> MCP
# services -> backend -> frontend. Copy .env.example to .env first.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot} -d ${POSTGRES_DB:-jobpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-shot: apply migrations + seed the test user, then exit.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: jobpilot-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot_dev_pw}@db:5432/${POSTGRES_DB:-jobpilot}
    command: >
      sh -c "cd /app && alembic upgrade head && cd /app/backend && python -m scripts.seed_user"
    depends_on:
      db:
        condition: service_healthy

  db-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    image: jobpilot-mcp:local
    command: ["uvicorn", "db_mcp.server:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot_dev_pw}@db:5432/${POSTGRES_DB:-jobpilot}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',8001),2)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  resume-mcp:
    image: jobpilot-mcp:local
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["uvicorn", "resume_mcp.server:app", "--host", "0.0.0.0", "--port", "8002"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot_dev_pw}@db:5432/${POSTGRES_DB:-jobpilot}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',8002),2)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # config-mcp — user search config (no storage, no LLM).
  config-mcp:
    image: jobpilot-mcp:local
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["uvicorn", "config_mcp.server:app", "--host", "0.0.0.0", "--port", "8003"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot_dev_pw}@db:5432/${POSTGRES_DB:-jobpilot}
    ports:
      - "8003:8003"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',8003),2)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # sources-mcp — connector hub. Makes LLM calls (crawl), so it needs ANTHROPIC_API_KEY
  # and the Adzuna creds (from .env); fail-fasts at boot without a real key. No DB.
  sources-mcp:
    image: jobpilot-mcp:local
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["uvicorn", "sources_mcp.server:app", "--host", "0.0.0.0", "--port", "8004"]
    env_file:
      - path: .env
        required: false
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',8004),2)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # pipeline-mcp — Phase 4 control surface (run/status/history + concurrency guard).
  # Enqueues the orchestrator task (producer only); reads pipeline_runs directly.
  pipeline-mcp:
    image: jobpilot-mcp:local
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["uvicorn", "pipeline_mcp.server:app", "--host", "0.0.0.0", "--port", "8005"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot_dev_pw}@db:5432/${POSTGRES_DB:-jobpilot}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8005:8005"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',8005),2)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: jobpilot-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot_dev_pw}@db:5432/${POSTGRES_DB:-jobpilot}
      REDIS_URL: redis://redis:6379/0
      DB_MCP_URL: http://db-mcp:8001/mcp
      RESUME_MCP_URL: http://resume-mcp:8002/mcp
      CONFIG_MCP_URL: http://config-mcp:8003/mcp
      SOURCES_MCP_URL: http://sources-mcp:8004/mcp
      PIPELINE_MCP_URL: http://pipeline-mcp:8005/mcp
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-mcp:
        condition: service_started
      resume-mcp:
        condition: service_started
      config-mcp:
        condition: service_started
      sources-mcp:
        condition: service_started
      pipeline-mcp:
        condition: service_started

  # Celery DATA-PLANE worker — runs the heavy stages (Scout fan-out + crawl, Qualify
  # LLM refine) on the default queue. Calls MCP services over HTTP; persists only
  # through db-mcp. Does NOT consume the orchestrator queue.
  worker:
    image: jobpilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "cd /app/backend && celery -A app.celery_app.celery worker -Q celery --loglevel=info"]
    env_file:
      - path: .env
        required: false
    # Runs Celery, not the HTTP server, so the backend image's HTTP healthcheck
    # doesn't apply here.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot_dev_pw}@db:5432/${POSTGRES_DB:-jobpilot}
      REDIS_URL: redis://redis:6379/0
      DB_MCP_URL: http://db-mcp:8001/mcp
      RESUME_MCP_URL: http://resume-mcp:8002/mcp
      CONFIG_MCP_URL: http://config-mcp:8003/mcp
      SOURCES_MCP_URL: http://sources-mcp:8004/mcp
      PIPELINE_MCP_URL: http://pipeline-mcp:8005/mcp
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-mcp:
        condition: service_started
      resume-mcp:
        condition: service_started
      config-mcp:
        condition: service_started
      sources-mcp:
        condition: service_started

  # Celery CONTROL-PLANE worker — runs ONLY the LangGraph orchestrator task on its
  # own queue, so awaiting a stage never starves the worker that runs the stage.
  # LLM-free; needs DATABASE_URL (Postgres checkpointer) + db-mcp (reconciliation).
  orchestrator-worker:
    image: jobpilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "cd /app/backend && celery -A app.celery_app.celery worker -Q orchestrator --loglevel=info"]
    env_file:
      - path: .env
        required: false
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot_dev_pw}@db:5432/${POSTGRES_DB:-jobpilot}
      REDIS_URL: redis://redis:6379/0
      DB_MCP_URL: http://db-mcp:8001/mcp
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-mcp:
        condition: service_started

  # Celery beat — the "agents run themselves" payoff. Ticks every minute and fires a
  # full pipeline for each user whose search_configs.schedule is due (respecting the
  # one-active-pipeline guard). Enqueues via the same task; heavy work runs elsewhere.
  beat:
    image: jobpilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "cd /app/backend && celery -A app.celery_app.celery beat --loglevel=info"]
    env_file:
      - path: .env
        required: false
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot_dev_pw}@db:5432/${POSTGRES_DB:-jobpilot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
