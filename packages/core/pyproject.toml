[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-core"
version = "0.1.0"
description = "Shared data layer, storage, parsing, and MCP auth for JobPilot."
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
    # pydantic >=2.11 is required by the MCP SDK; 2.13.4 is the tested version.
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.7.1",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    # 6.4.0 (not 8.x): Celery's kombu[redis] extra caps redis<6.5. We only use the
    # async client for a readiness ping, whose API is stable across 5.x/6.x.
    "redis==6.4.0",
    "boto3==1.43.40",
    "pdfplumber==0.11.10",
    "pypdf>=5.1",
    "python-docx==1.2.0",
    # Phase 2: LLM extraction (crawl path) + HTTP connectors + HTML parsing.
    "anthropic==0.116.0",
    "httpx>=0.27",
    "beautifulsoup4==4.12.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jobpilot_core*"]
