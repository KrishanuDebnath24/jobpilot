[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-core"
version = "0.1.0"
description = "Shared data layer, storage, parsing, and MCP auth for JobPilot."
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.1",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    "redis==8.0.1",
    "boto3==1.43.40",
    "pdfplumber==0.11.10",
    "pypdf>=5.1",
    "python-docx==1.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jobpilot_core*"]
